<header class="site-header" id="site-header"></header>

<main id="main">

<section class="hero page-hero hero-fallback" data-img-key="experienceGastronomy" id="rest-hero">
  <div class="container hero-inner">
    <div class="breadcrumb"><a href="../index.html" data-i18n="breadcrumb_inicio">Inici</a> / <a href="../restauracion.html" data-i18n="nav_restauracion">Restauració</a> / <span id="rest-name-crumb"></span></div>

  <div class="container container-narrow">
    <div id="rest-menu"></div>

<script>window.SITE_BASE = "../";</script>
<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/main.js"></script>
<script>
  function renderRestaurantDetail() {
    const slug = new URLSearchParams(window.location.search).get("r");
    const restaurant = RESTAURANTS.find((r) => r.slug === slug) || RESTAURANTS[0];

    document.title = `${tr(restaurant.name)} · Caldes de Boí`;
    document.getElementById("rest-name").textContent = tr(restaurant.name);
    document.getElementById("rest-name-crumb").textContent = tr(restaurant.name);
    document.getElementById("rest-tag").textContent = `${tr(restaurant.hotel)} · ${tr(restaurant.style)}`;
    document.getElementById("rest-desc").textContent = tr(restaurant.description);
    document.getElementById("rest-hero").setAttribute("data-img-key", restaurant.image);

    // SEO por restaurante: canonical, og:url y descripción propios.
    const pageUrl = `https://robsmm8.github.io/caldes-de-boi-web/restaurantes/restaurante.html?r=${restaurant.slug}`;
    document.getElementById("canonical-link").setAttribute("href", pageUrl);
    document.getElementById("og-url").setAttribute("content", pageUrl);
    document.querySelector('meta[property="og:title"]').setAttribute("content", document.title);
    document.querySelectorAll('meta[name="description"], meta[property="og:description"]').forEach((m) => {
      m.removeAttribute("data-i18n-content"); // la descripción es la del propio restaurante
      m.setAttribute("content", tr(restaurant.description));
    });

    document.getElementById("rest-menu").innerHTML = restaurant.menu
      .map(
        (section) => `
        <div class="menu-section">
          <h2>${tr(section.section)}</h2>
          ${section.items
            .map(
              (item) => `
            <div class="menu-item">
              <span>${tr(item.name)}</span>
              <span class="price">${item.price}</span>
            </div>`
            )
            .join("")}
        </div>`
      )
      .join("");

    applyImages();
  }
  window.rerenderDynamicContent = renderRestaurantDetail;
  document.addEventListener("DOMContentLoaded", renderRestaurantDetail);
</script>
</body>
</html>
