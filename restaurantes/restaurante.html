<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carta · Caldes de Boí</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="restauracion">

<a href="#main" class="skip-link" data-i18n="skip_link">Saltar al contenido</a>

<header class="site-header" id="site-header"></header>

<main id="main">

<section class="hero page-hero" data-img-key="experienceGastronomy" id="rest-hero">
  <div class="container hero-inner">
    <div class="breadcrumb"><a href="../index.html" data-i18n="breadcrumb_inicio">Inici</a> / <a href="../restauracion.html" data-i18n="nav_restauracion">Restauració</a> / <span id="rest-name-crumb"></span></div>
    <span class="lede" id="rest-tag"></span>
    <h1 id="rest-name"></h1>
    <p class="desc" id="rest-desc"></p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:760px;">
    <div id="rest-menu"></div>
    <a href="../restauracion.html" class="btn btn-light" data-i18n="btn_volver_restaurantes">&larr; Tornar a restaurants</a>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script>window.SITE_BASE = "../";</script>
<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script>
  function renderRestaurantDetail() {
    const slug = new URLSearchParams(window.location.search).get("r");
    const restaurant = RESTAURANTS.find((r) => r.slug === slug) || RESTAURANTS[0];

    document.title = `${tr(restaurant.name)} · Caldes de Boí`;
    document.getElementById("rest-name").textContent = tr(restaurant.name);
    document.getElementById("rest-name-crumb").textContent = tr(restaurant.name);
    document.getElementById("rest-tag").textContent = `${tr(restaurant.hotel)} · ${tr(restaurant.style)}`;
    document.getElementById("rest-desc").textContent = tr(restaurant.description);
    document.getElementById("rest-hero").setAttribute("data-img-key", restaurant.image);

    document.getElementById("rest-menu").innerHTML = restaurant.menu
      .map(
        (section) => `
        <div class="menu-section">
          <h2>${tr(section.section)}</h2>
          ${section.items
            .map(
              (item) => `
            <div class="menu-item">
              <span>${tr(item.name)}</span>
              <span class="price">${item.price}</span>
            </div>`
            )
            .join("")}
        </div>`
      )
      .join("");

    applyImages();
  }
  window.rerenderDynamicContent = renderRestaurantDetail;
  document.addEventListener("DOMContentLoaded", renderRestaurantDetail);
</script>
</body>
</html>
