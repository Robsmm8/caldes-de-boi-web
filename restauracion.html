<meta property="og:description" content="Restaurants i bars de Caldes de Boí: Restaurant Manantial, Bar del Manantial, Restaurant Caldas i Club Piscina. Consulta les cartes." data-i18n-content="meta_desc_restauracion" />

</head>
<body data-page="restauracion">

<a href="#main" class="skip-link" data-i18n="skip_link">Saltar al contingut</a>

<noscript><p class="noscript-msg">Aquesta web necessita JavaScript per mostrar el contingut (cercador, idiomes, cartes). Activa'l al teu navegador per continuar.</p></noscript>

<header class="site-header" id="site-header"></header>

<main id="main">

<section class="hero page-hero hero-fallback" data-img-key="experienceGastronomy">
  <div class="container hero-inner">
    <div class="breadcrumb"><a href="index.html" data-i18n="breadcrumb_inicio">Inici</a> / <span data-i18n="nav_restauracion">Restauració</span></div>
    <span class="lede" data-i18n="restauracion_hero_lede">Gastronomia</span>
    <h1 data-i18n="restauracion_hero_title">Restaurants del complex</h1>
    <p class="desc" data-i18n="restauracion_hero_desc">Cada espai gastronòmic de Caldes de Boí té el seu propi caràcter. Tria'n un per veure la carta completa.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow" data-i18n="restauracion_eyebrow">On menjar</span>
      <h2 data-i18n="restauracion_title">Els nostres restaurants</h2>
    </div>
    <div class="grid-3" id="restaurant-list"></div>
  </div>
</section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  function renderRestaurantList() {
    const t = UI_STRINGS[getLang()] || UI_STRINGS.ca;
    const container = document.getElementById("restaurant-list");
    container.innerHTML = RESTAURANTS.map(
      (r) => `
      <div class="restaurant-card">
        <img data-img-key="${r.image}" width="600" height="400" alt="${tr(r.name)}" />
        <div class="body">
          <span class="tag">${tr(r.hotel)}</span>
          <h3>${tr(r.name)}</h3>
          <p>${tr(r.description)}</p>
          <a class="btn btn-primary btn-sm" href="restaurantes/restaurante.html?r=${r.slug}">${t.btn_ver_carta}<span class="sr-only"> — ${tr(r.name)}</span></a>
        </div>
      </div>`
    ).join("");
    applyImages();
  }
  window.rerenderDynamicContent = renderRestaurantList;
  document.addEventListener("DOMContentLoaded", renderRestaurantList);
</script>
</body>
</html>
